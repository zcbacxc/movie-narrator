[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-narrator"
version = "0.9.1"
description = "Generate narrated movie recap videos from a single prompt."
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    {name = "zcbacxc", email = "zcbacxc@users.noreply.github.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "edge-tts>=7.0.0",
    "moviepy>=2.0,<3.0",
    "pillow>=11.0.0",
    "pydub>=0.25.0",
    "pyyaml>=6.0",
    "tqdm>=4.0.0",
    'audioop-lts>=0.2.0; python_version >= "3.13"',
]

[project.optional-dependencies]
media = ["scenedetect>=0.6"]
ml = [
    'whisperx>=3.0; python_version < "3.14"',
    'faster-whisper>=1.0; python_version < "3.14"',
    'sentence-transformers>=3.0; python_version < "3.14"',
]
full = [
    "scenedetect>=0.6",
    'whisperx>=3.0; python_version < "3.14"',
    'faster-whisper>=1.0; python_version < "3.14"',
    'sentence-transformers>=3.0; python_version < "3.14"',
]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-timeout>=2.0", "mypy>=1.10", "ruff>=0.4"]
docs = [
    "mkdocs>=1.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=9.0",
]

[project.urls]
Homepage = "https://github.com/zcbacxc/movie-narrator"
Repository = "https://github.com/zcbacxc/movie-narrator"
Issues = "https://github.com/zcbacxc/movie-narrator/issues"

[project.scripts]
mn = "movie_narrator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["movie_narrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
follow_imports = "skip"
files = ["src/movie_narrator/workflow", "src/movie_narrator/cloud", "src/movie_narrator/utils"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "BLE", "A"]
ignore = ["E501", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
