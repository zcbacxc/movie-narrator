{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "movie-narrator.fullname" . }}
  labels:
    {{- include "movie-narrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  # v1.2: `mn serve` refuses a non-loopback bind without an API key.
  # When auth.apiKey is empty a random key is generated AT INSTALL TIME
  # and re-generated on every `helm upgrade` — set auth.apiKey or
  # auth.existingSecret for production stability (see values.yaml).
  api-key: {{ .Values.auth.apiKey | default (randAlphaNum 32) | quote }}
{{- end }}
