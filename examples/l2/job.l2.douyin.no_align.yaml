# L2+ Test variant — disable align_audio to isolate detect_scenes crash
# (Temporary diagnostic config for v0.4.27 L2+ test)

duration: 60
format: "16:9"
narration_preset: douyin-fast
keep_cache: true
strict: false
no_clips: true

steps:
  research: true
  align: false       # diagnostic: disable align to isolate scene crash
  translate: false

params:
  match_min_score: 0.25
  match_speed_clamp_min: 0.85
  match_speed_clamp_max: 1.25
  scene_merge_min_duration: 2.0
  match_drop_scene_min_duration: 0.4
  render_fit_mode: cover
  render_crf: 18
  render_preset: slow
  render_faststart: true
  render_subtitle_position: bottom
  qa_enabled: true
  bgm_normalize: true
