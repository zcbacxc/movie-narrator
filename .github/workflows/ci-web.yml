name: CI — Web Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "packages/web/**"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/web/webui/package-lock.json

      - name: Install frontend dependencies
        working-directory: packages/web/webui
        run: npm ci

      - name: Type-check and build frontend
        working-directory: packages/web/webui
        run: npm run build

      - name: Verify build output
        run: |
          test -f packages/web/src/movie_narrator_web/static/index.html
          test -n "$(ls packages/web/src/movie_narrator_web/static/assets/*.js)"
          test -n "$(ls packages/web/src/movie_narrator_web/static/assets/*.css)"
          echo "Frontend build verified"

  web-tests:
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install core engine (development mode)
        run: pip install -e ".[dev]"

      - name: Install web package (development mode)
        working-directory: packages/web
        run: pip install -e ".[dev]"

      - name: Run web package tests
        working-directory: packages/web
        run: pytest tests/ -v

      - name: Verify mn-web entry point
        run: mn-web --help || true
