name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Concurrency control: cancel in-progress runs for the same PR/branch
# when a new push arrives. This avoids wasted CI minutes when a PR is
# amended + force-pushed (e.g. PR #57 triggered 28 runs instead of 14).
#
# Trigger strategy:
# - push: only main branch (feature/hotfix branches don't trigger CI
#   on push — they get CI via the pull_request event instead, avoiding
#   duplicate runs from push + PR sync)
# - pull_request: all PRs targeting main
# - workflow_dispatch: manual triggers
#
# Group strategy:
# - PR: use pr-{number} so amend + force-push cancels old runs
# - push to main: use ref name (one active run per branch)
# - workflow_dispatch: use run_id (never cancels manual triggers)
#
# cancel-in-progress: cancel for PR events AND non-main branch pushes.
# Main-branch pushes represent "release-ready" verification — each push
# runs to completion so we always have a final pass/fail signal on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"
      - name: Ruff lint check
        run: ruff check src/
      - name: Mypy type check
        run: mypy src/movie_narrator/workflow src/movie_narrator/cloud src/movie_narrator/utils

  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/ -m "not integration" -v --timeout=300

      # v0.9.5: coverage gate — enforced on the 3.11 matrix leg only to avoid
      # redundant coverage collection across all four versions. The threshold
      # (80%) is read from .coveragerc; raise it in later point releases.
      # Integration tests are excluded here (they run in the dedicated
      # `integration` job) so the unit suite is measured consistently.
      - name: Coverage gate (3.11)
        if: matrix.python-version == '3.11'
        run: pytest tests/ -m "not integration" -q --timeout=300 --cov=movie_narrator --cov-report=term --cov-fail-under=80

      - name: Verify CLI entry points
        run: |
          mn --help
          mn version

      - name: Smoke test (full pipeline with mock)
        env:
          CI: 1
        run: |
          mn create --movie "CI-Test" --style "test" --duration 10 --keep-cache
          test -f output/CI-Test/script.md
          test -f output/CI-Test/final.mp4
          test -f output/CI-Test/subtitle.srt
          test -f output/CI-Test/metadata.json
          test -f output/CI-Test/narration.mp3
          echo "Smoke test passed"

      - name: Smoke test (YAML config)
        working-directory: examples
        env:
          CI: 1
        run: |
          mn create --config ci-test.yaml
          test -f output/CI-YAML-Test/script.md
          test -f output/CI-YAML-Test/final.mp4
          test -f output/CI-YAML-Test/metadata.json
          test -f output/CI-YAML-Test/subtitle.srt
          echo "YAML config smoke test passed"

  # Summary job — name "test" matches branch protection required check.
  # Matrix jobs generate "test-matrix (3.10)" etc. which don't match.
  # This job depends on all matrix jobs + lint and is a no-op gate.
  test:
    needs: [test-matrix, lint, integration]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [[ "${{ needs.test-matrix.result }}" == "success" && "${{ needs.lint.result }}" == "success" && "${{ needs.integration.result }}" == "success" ]]; then
            echo "All matrix, lint and integration jobs passed"
          else
            echo "Matrix jobs: ${{ needs.test-matrix.result }}, Lint: ${{ needs.lint.result }}, Integration: ${{ needs.integration.result }}"
            exit 1
          fi

  media:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install with media extras
        run: pip install -e ".[media,dev]"

      - name: Run scene / match unit tests
        run: pytest tests/test_scenes.py tests/test_match.py tests/test_optional_deps.py -v

  # v0.9.5: security scanning — SAST (bandit) + dependency audit (pip-audit).
  # Not gated by the `test` summary job; failures surface as a separate
  # required check so the whole pipeline is not blocked by a stale
  # advisory on a transitive dependency.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"
      - name: SAST — bandit
        run: bandit -r src/ -c pyproject.toml
      - name: Dependency audit — pip-audit
        # Audit the installed environment (the [dev] extra above pulls in
        # every declared runtime + dev dependency). `-r pyproject.toml` is
        # NOT valid — pip-audit treats that flag's argument as a
        # requirements file, not a project file.
        run: pip-audit

  # v0.9.5: integration tests — real-subsystem end-to-end coverage unified
  # under the ``integration`` pytest marker. Requires ffmpeg + the [media]
  # extra (scenedetect/OpenCV), so it runs in its own job with its own
  # timeout rather than bloating the unit test-matrix.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - run: pip install -e ".[media,dev]"
      - name: Run integration tests
        env:
          CI: 1
        run: pytest tests/ -m integration -v --timeout=300
