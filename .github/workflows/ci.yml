name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - run: |
          pip install -e ".[dev]"
          pip install pytest-timeout
      - name: Run unit tests
        run: pytest tests/ -v --timeout=300

      - name: Verify CLI entry points
        run: |
          mn --help
          mn version

      - name: Smoke test (full pipeline with mock)
        env:
          CI: 1
        run: |
          mn create --movie "CI-Test" --style "test" --duration 10 --keep-cache
          test -f output/CI-Test/script.md
          test -f output/CI-Test/final.mp4
          test -f output/CI-Test/subtitle.srt
          test -f output/CI-Test/metadata.json
          test -f output/CI-Test/narration.mp3
          echo "Smoke test passed"

      - name: Smoke test (YAML config)
        working-directory: examples
        env:
          CI: 1
        run: |
          mn create --config ci-test.yaml
          test -f output/CI-YAML-Test/script.md
          test -f output/CI-YAML-Test/final.mp4
          test -f output/CI-YAML-Test/metadata.json
          test -f output/CI-YAML-Test/subtitle.srt
          echo "YAML config smoke test passed"

  test:
    needs: [test-matrix]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check matrix results
        run: |
          if [[ "${{ needs.test-matrix.result }}" == "success" ]]; then
            echo "All matrix jobs passed"
          else
            echo "Matrix jobs failed: ${{ needs.test-matrix.result }}"
            exit 1
          fi

  media:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install with media extras
        run: pip install -e ".[media,dev]"

      - name: Run scene / match unit tests
        run: pytest tests/test_scenes.py tests/test_match.py tests/test_optional_deps.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff>=0.4' 'mypy>=1.10'
      - name: Run ruff
        run: ruff check src/
      - name: Run mypy
        run: mypy src/movie_narrator/workflow src/movie_narrator/cloud src/movie_narrator/utils
        continue-on-error: true  # baseline mode
