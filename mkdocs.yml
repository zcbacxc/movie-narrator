site_name: movie-narrator
site_description: Generate narrated movie recap videos from a single prompt.
site_url: https://github.com/zcbacxc/movie-narrator
repo_url: https://github.com/zcbacxc/movie-narrator
repo_name: zcbacxc/movie-narrator
edit_uri: edit/main/docs/

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - yaml
    - bash
    - toml

nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Tutorial: TUTORIAL.md
  - Best Practices: BEST_PRACTICES.md
  - Roadmap: ROADMAP.md
  - Migration Guide: MIGRATION.md
  - API Stability: STABILITY.md
  - Release Checklist: RELEASE_CHECKLIST.md
  - LLM Providers: LLM_PROVIDERS.md
  - AI Guide: AI_GUIDE.md
  - Plugin Development: PLUGIN_DEVELOPMENT.md
  - Architecture: ARCHITECTURE.md
  - Architecture Decision Records: ADR.md
  - Metadata Schema: METADATA_SCHEMA.md
  - Contributing: CONTRIBUTING.md
  - Deployment: DEPLOYMENT.md
  - Observability: OBSERVABILITY.md
  - Packaging: PACKAGING.md
  - SDK Reference:
      - Contract: sdk/contract.md
      - Models: sdk/models.md
      - Pipeline: sdk/pipeline.md
      - Step Registry: sdk/step_registry.md
      - Pipeline Errors: sdk/errors.md
      - Registries: sdk/registries.md
      - TTS: sdk/tts.md
      - Vision: sdk/vision.md
      - Presets: sdk/presets.md
      - Cloud: sdk/cloud.md
      - Reliability: sdk/reliability.md

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_"
              - "!^__"

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
