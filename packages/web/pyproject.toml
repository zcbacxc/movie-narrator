[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-narrator-web"
version = "0.5.0"
description = "Web UI (FastAPI + React) for movie-narrator — install separately from the core engine."
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "zcbacxc", email = "zcbacxc@users.noreply.github.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "movie-narrator>=0.5.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/zcbacxc/movie-narrator"
Repository = "https://github.com/zcbacxc/movie-narrator"
Issues = "https://github.com/zcbacxc/movie-narrator/issues"

[project.scripts]
mn-web = "movie_narrator_web:launch_web_api"

[tool.setuptools.packages.find]
where = ["src"]
include = ["movie_narrator_web*"]

[tool.setuptools.package-data]
"movie_narrator_web" = ["static/**"]
